<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SaaSBillingEngine — System Rozliczeń SaaS{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">
    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="p-2 bg-indigo-600 text-white rounded-lg font-bold text-lg shadow-sm">⚡</span>
                <div>
                    <a href="{{ url_for('web.index') }}" class="font-bold text-xl text-slate-900 tracking-tight hover:text-indigo-600 transition">SaaSBillingEngine</a>
                    <span class="text-xs text-slate-500 block">System rozliczeń subskrypcyjnych SaaS</span>
                </div>
            </div>
            <div class="flex items-center space-x-4 text-sm font-medium">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
                    Aktywny silnik v1.0
                </span>
                <a href="#simulator" class="text-slate-600 hover:text-indigo-600 transition">Symulator Proration</a>
                <a href="#plans" class="text-slate-600 hover:text-indigo-600 transition">Katalog Planów</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-sm text-slate-500">
        <div class="max-w-7xl mx-auto px-4">
            <p><strong>SaaSBillingEngine</strong> &bull; Projekt z kursu <em>Testowanie i Jakość Oprogramowania</em> &bull; Autor: Kacper Szczudło</p>
        </div>
    </footer>
</body>
</html>
